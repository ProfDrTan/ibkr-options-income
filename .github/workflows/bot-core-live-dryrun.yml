name: bot_core live pipeline dry-run

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker to run Almanac/Technical agents against (e.g. ^GSPC, ^NDX)'
        required: false
        default: '^GSPC'

permissions:
  contents: write

jobs:
  live-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ibkr-options-income (this repo)
        uses: actions/checkout@v4
        with:
          path: ibkr-options-income

      - name: Checkout market-prediction-engine (real agents)
        uses: actions/checkout@v4
        with:
          repository: ProfDrTan/market-prediction-engine
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: market-prediction-engine

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance requests pytest
          pip install -r market-prediction-engine/requirements.txt

      - name: Run real agents (incl. Fundamental) against live data, write result to repo file
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/market-prediction-engine:$GITHUB_WORKSPACE/ibkr-options-income/bot_core:$PYTHONPATH"
          mkdir -p ibkr-options-income/bot_core/dry_run_results
          python3 - <<'EOF'
          import json
          from datetime import datetime, timezone
          from agents.almanac.almanac_agent import run as run_almanac
          from agents.macro.macro_agent import run as run_macro
          from agents.technical.technical_agent import run as run_technical
          from agents.adapters.score_mapping import map_almanac, map_macro, map_technical
          from agents.composite import CompositeScorer
          from agents.fundamental.agent import FundamentalAgent

          ticker = "${{ github.event.inputs.ticker }}" or "^GSPC"

          try:
              almanac_out = run_almanac(ticker)
              macro_out = run_macro()
              tech_out = run_technical(ticker)

              a = map_almanac(almanac_out)
              m = map_macro(macro_out)
              t = map_technical(tech_out)

              fundamental_agent = FundamentalAgent()
              f = fundamental_agent.run({"earnings_season_active": False})

              scorer = CompositeScorer()
              result = scorer.score({
                  "almanac": a, "macro": m, "technical": t, "fundamental": f,
              })

              output = {
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
                  "ticker": ticker,
                  "almanac": {"score": a.score, "confidence": a.confidence, "rationale": a.rationale},
                  "macro": {"score": m.score, "confidence": m.confidence, "rationale": m.rationale},
                  "technical": {"score": t.score, "confidence": t.confidence, "rationale": t.rationale},
                  "fundamental": {"score": f.score, "confidence": f.confidence, "rationale": f.rationale, "stale": f.stale},
                  "composite_score": result.weighted_score,
                  "bias": result.bias.value,
                  "veto_triggered": result.veto_triggered,
                  "veto_reason": result.veto_reason,
              }
          except Exception as e:
              output = {
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
                  "ticker": ticker,
                  "error": str(e),
                  "error_type": type(e).__name__,
              }

          fname = f"ibkr-options-income/bot_core/dry_run_results/{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}.json"
          with open(fname, "w") as f_out:
              json.dump(output, f_out, indent=2)
          print(json.dumps(output, indent=2))
          EOF

      - name: Commit result file
        run: |
          cd ibkr-options-income
          git config user.name "bot-core-dry-run"
          git config user.email "actions@github.com"
          git add bot_core/dry_run_results/
          git commit -m "Live dry-run result $(date -u +%Y%m%dT%H%M%SZ)" || echo "Nothing to commit"
          git push
