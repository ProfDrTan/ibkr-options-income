name: bot_core backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backtest start date (YYYY-MM-DD)'
        required: false
        default: '2018-01-01'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ibkr-options-income (this repo)
        uses: actions/checkout@v4
        with:
          path: ibkr-options-income

      - name: Checkout market-prediction-engine (real agents)
        uses: actions/checkout@v4
        with:
          repository: ProfDrTan/market-prediction-engine
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: market-prediction-engine

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance requests pandas

      - name: Run point-in-time backtest
        id: backtest
        continue-on-error: true
        run: |
          cd ibkr-options-income/bot_core/backtest
          python3 run_backtest.py

      - name: Move result into repo and commit
        if: always()
        run: |
          cd ibkr-options-income
          mkdir -p bot_core/backtest_results
          mv bot_core/backtest/backtest_result.json "bot_core/backtest_results/$(date -u +%Y%m%dT%H%M%SZ).json" || echo "no result file to move (backtest script likely crashed before writing it)"
          git config user.name "bot-core-backtest"
          git config user.email "actions@github.com"
          git add bot_core/backtest_results/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Backtest run $(date -u +%Y%m%dT%H%M%SZ)"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying after rebase..."
              sleep 3
            done
          fi

      - name: Fail the job if the backtest itself errored
        if: steps.backtest.outcome == 'failure'
        run: exit 1
